[package]
name = "drand-spike"
description = "Spike: verify a drand quicknet round on Soroban and measure its cost"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
soroban-sdk = { version = "23.0.1", default-features = false }

[features]
# Measurement against the real .wasm (build it first; see src/test.rs).
wasm-bench = []

[dev-dependencies]
soroban-sdk = { version = "23.0.1", features = ["testutils"] }
ark-bls12-381 = "0.4"
ark-ec = "0.4"
ark-serialize = "0.4"
hex = "0.4"

[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true

[workspace]
