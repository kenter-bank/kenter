# Kenter Tunnler Nginx Configuration
#
# This config handles:
# 1. Base domain (relay.example.org) - API, WebSocket, health endpoints
# 2. Subdomain routing (GADDR.relay.example.org) - Tunnel proxy to clients
# 3. Custom domain routing - ACME challenges + reverse proxy
#
# Install:
#   sudo cp config/nginx-kenter-tunnler.conf /etc/nginx/sites-available/kenter-tunnler
#   sudo ln -sf /etc/nginx/sites-available/kenter-tunnler /etc/nginx/sites-enabled/
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo nginx -t && sudo systemctl reload nginx
#
# Replace relay.example.org with your relay's domain throughout. Obtain the
# certificate first (the HTTPS blocks below already point at it); do not use
# `certbot install --nginx`, which rewrites these blocks:
#   certbot certonly --manual --preferred-challenges dns -d relay.example.org -d "*.relay.example.org"

# Rate limiting zones (per-IP WebSocket connections)
limit_conn_zone $binary_remote_addr zone=ws_conn:10m;

# /proxy is unauthenticated: any address on the internet can aim requests
# at a connected node, and each one costs the relay a task, a pending
# stream and a message on that node's queue. The tunnler caps its own
# in-flight work; this keeps the flood from arriving in the
# first place. A wallet makes a handful of calls per print; 10 a second
# per IP leaves room for depositors who share an address (a Tor exit).
limit_req_zone $binary_remote_addr zone=proxy_req:10m rate=10r/s;
limit_req_status 429;

upstream tunnler {
    server 127.0.0.1:8000;
    keepalive 32;
}

# Map to extract Stellar address from subdomain
# Example: GABC1234.relay.example.org -> GABC1234
map $host $stellar_address {
    ~*^(?<addr>[A-Za-z0-9]+)\.relay\.example\.org$ $addr;
    default "";
}

# HTTP server for base domain (API, WebSocket, certbot)
server {
    listen 80;
    server_name relay.example.org;

    # Certbot challenge
    location /.well-known/acme-challenge/ {
        root /var/www/acme;
    }

    # Security headers
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Everything else is a redirect. Until certbot has run there is no
    # HTTPS listener, so proxying here would carry the WebSocket
    # handshake -- JWT and all -- in cleartext, and would keep carrying
    # it afterwards for anyone who typed http://. Refusing is what stops
    # that being an option.
    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTP server for tunnel subdomains (GADDR.relay.example.org)
server {
    listen 80;
    server_name *.relay.example.org;

    # Certbot challenge
    location /.well-known/acme-challenge/ {
        root /var/www/acme;
    }

    # Security headers
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Everything else is a redirect. Until certbot has run there is no
    # HTTPS listener, so proxying here would carry the WebSocket
    # handshake -- JWT and all -- in cleartext, and would keep carrying
    # it afterwards for anyone who typed http://. Refusing is what stops
    # that being an option.
    location / {
        return 301 https://$host$request_uri;
    }
}

# ─────────────────────────────────────────────────────────────────────
# HTTPS. These are the blocks that actually proxy.
#
# Port 80 does not proxy. Proxying there on the understanding that
# certbot would add TLS later would leave the WebSocket handshake -- the
# JWT included -- in cleartext on every deployment until somebody ran
# certbot by hand, and afterwards for anyone who typed `http://`.
#
# nginx will not start if these certificate files are missing, which is
# deliberate: the failure is loud, at deploy time, instead of quiet and
# in cleartext. Obtain the certificate first. The VPS script uses a
# DNS-01 challenge, so nothing needs to be serving to get one:
#
#   certbot certonly --manual --preferred-challenges dns \
#           -d relay.example.org -d '*.relay.example.org'
# ─────────────────────────────────────────────────────────────────────

# HTTPS for the base domain (API, WebSocket)
server {
    # `listen ... http2`, not `http2 on`: that needs nginx 1.25.1+, and Debian 12
    # (1.22) and Ubuntu 24.04 (1.24) ship older. Newer nginx only warns.
    listen 443 ssl http2;
    server_name relay.example.org;

    ssl_certificate     /etc/letsencrypt/live/relay.example.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/relay.example.org/privkey.pem;
    # A wallet sends at most a few KB; the relay itself refuses a body over
    # 64 KiB. Short header and body timeouts keep slow clients from holding
    # connections open.
    client_max_body_size 64k;
    client_header_timeout 10s;
    client_body_timeout 10s;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;

    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # WebSocket for tunnel connections
    location /connect {
        limit_conn ws_conn 5;

        proxy_pass http://tunnler;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        # The tunnler's auth rate limiter and challenge binding key on
        # this. It is believed only from a peer in
        # TUNNLER_TRUSTED_PROXIES, so it must be set here and must not
        # be passed through from the client.
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;
        proxy_send_timeout 86400;
    }

    # API and health endpoints
    location / {
        limit_req zone=proxy_req burst=20 nodelay;

        proxy_pass http://tunnler;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # The relay waits up to 120 s for a node (TUNNLER_REQUEST_TIMEOUT);
        # nginx must wait longer, or slow requests end in a 504.
        proxy_read_timeout 150;
        proxy_send_timeout 150;
    }
}

# HTTPS for tunnel subdomains (GADDR.relay.example.org)
server {
    listen 443 ssl http2;
    server_name *.relay.example.org;

    ssl_certificate     /etc/letsencrypt/live/relay.example.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/relay.example.org/privkey.pem;
    # A wallet sends at most a few KB; the relay itself refuses a body over
    # 64 KiB. Short header and body timeouts keep slow clients from holding
    # connections open.
    client_max_body_size 64k;
    client_header_timeout 10s;
    client_body_timeout 10s;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;

    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # All requests to subdomains go through the proxy endpoint
    location / {
        limit_req zone=proxy_req burst=20 nodelay;

        proxy_pass http://tunnler/proxy/$stellar_address$uri$is_args$args;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Stellar-Address $stellar_address;
        # The relay waits up to 120 s for a node (TUNNLER_REQUEST_TIMEOUT);
        # nginx must wait longer, or slow requests end in a 504.
        proxy_read_timeout 150;
        proxy_send_timeout 150;
    }
}

# Catch-all for ACME challenges on custom domains (port 80)
server {
    listen 80 default_server;
    server_name _;

    location /.well-known/acme-challenge/ {
        root /var/www/acme;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# Catch-all for custom domains (port 443)
server {
    listen 443 ssl default_server;
    server_name _;

    ssl_certificate     /etc/letsencrypt/live/$ssl_server_name/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/$ssl_server_name/privkey.pem;
    # A wallet sends at most a few KB; the relay itself refuses a body over
    # 64 KiB. Short header and body timeouts keep slow clients from holding
    # connections open.
    client_max_body_size 64k;
    client_header_timeout 10s;
    client_body_timeout 10s;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;

    # Security headers
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    location / {
        limit_req zone=proxy_req burst=20 nodelay;

        proxy_pass http://tunnler/proxy$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Custom-Domain $host;
        # The relay waits up to 120 s for a node (TUNNLER_REQUEST_TIMEOUT);
        # nginx must wait longer, or slow requests end in a 504.
        proxy_read_timeout 150;
        proxy_send_timeout 150;
    }
}

# The HTTPS blocks above are part of this file on purpose. Leaving them
# to `certbot install --nginx` meant the deployment served plaintext
# until someone remembered, and certbot clones whatever the port-80
# block contains -- which is now a redirect, so cloning it would
# produce a 443 block that redirects to itself. Use `certbot certonly`
# and leave this file to say what is proxied.
