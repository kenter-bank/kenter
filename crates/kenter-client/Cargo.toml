[package]
name = "kenter-client"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Soroban RPC client for kenter-mint and kenter-roster contracts"

[features]
# Adapter that makes MintClient satisfy kenter_wallet::ChainRead. Off by default
# (native-only; pulls the wallet core). Shells that drive the wallet enable it.
wallet = ["dep:kenter-wallet"]
# Build for mainnet instead of testnet (`network.rs`). The network is fixed
# per build; a release is built with this on, and with KENTER_MAINNET_MINT
# and KENTER_MAINNET_ROSTER set in the build environment.
mainnet = []

[dependencies]
kenter-crypto = { path = "../kenter-crypto" }
# Optional: only for the `wallet` feature's ChainRead adapter (see src/wallet.rs).
kenter-wallet = { path = "../kenter-wallet", optional = true }

# Soroban transaction building + XDR
stellar-xdr = { version = "23", features = ["std", "curr"] }
stellar-strkey = { workspace = true }

# HTTP client for Soroban RPC
reqwest = { version = "0.12", features = ["json"] }

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }
base64 = { workspace = true }

# Ed25519 signing (transaction signatures)
ed25519-dalek = { workspace = true }

# Hashing (transaction hash)
sha2 = { workspace = true }

# Hex
hex = { workspace = true }

# The drand beacon publishes compressed BLS12-381 G1 signatures; the mint
# takes them uncompressed (`beacon.rs`). Decompression only -- the mint
# verifies. arkworks at the version the Soroban host itself uses, with
# default features off so nothing beyond the curve arithmetic is built.
ark-bls12-381 = { version = "0.4", default-features = false, features = ["curve"] }
ark-serialize = { version = "0.4", default-features = false }

# Async
tokio = { workspace = true }

# Logging
tracing = { workspace = true }

# Error handling
thiserror = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
