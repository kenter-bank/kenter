[package]
name = "kenter-tunnler"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "WebSocket tunnel relay server for the Kenter bearer token system"

[[bin]]
name = "kenter-tunnler"
path = "src/main.rs"

[features]
# Mainnet defaults for the roster RPC (`config.rs`); see kenter-client's.
mainnet = []
# Build OpenSSL from source instead of linking the system's, so one Linux
# build runs on any distribution with glibc >= 2.31 (packaging/relay).
vendored-openssl = ["dep:openssl", "openssl/vendored"]

[dependencies]
kenter-crypto = { path = "../kenter-crypto" }
kenter-network = { path = "../kenter-network" }

# Web framework + WebSocket
axum = { version = "0.7", features = ["ws"] }
tower-http = { version = "0.5", features = ["cors", "trace"] }

# Async runtime
tokio = { workspace = true }
futures-util = { workspace = true }

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }

# Crypto
ed25519-dalek = { workspace = true }

# Concurrent data structures
dashmap = "6"

# Logging
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

# Encoding
hex = { workspace = true }
base64 = { workspace = true }

# Stellar address parsing
stellar-strkey = { workspace = true }

# Randomness
rand = { workspace = true }

# Error handling
thiserror = { workspace = true }

# HTTP client (for Soroban RPC)
reqwest = { version = "0.12", features = ["json"] }
# Only for feature `vendored-openssl`.
openssl = { version = "0.10", optional = true }

# Stellar XDR types (for building ledger key queries)
stellar-xdr = { version = "23", features = ["std", "curr"] }

# Configuration
dotenvy = "0.15"

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
