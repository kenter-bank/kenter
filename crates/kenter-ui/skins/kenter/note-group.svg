  <!--
    PLACEHOLDER. The container a note and its opened detail live in.

    This exists because without it an expanded note was three stacked
    rectangles: the card and each detail row were siblings in one flat list,
    all wearing `list-row`, so opening a note looked like two unrelated rows
    appearing underneath an unrelated row. Nothing said they belonged
    together.

    Collapsed it draws nothing - a closed note is just its card, and a border
    around a single card is noise. Open, it draws the enclosure. The height
    is whatever the contents need; 9-slice keeps the corners honest.
  -->
  <!-- Closed: the card speaks for itself. -->
  <g
     data-pelt-state="default"
     inkscape:groupmode="layer"
     inkscape:label="default"
     id="g1" />
  <!-- Open: one object, with the card's accent carried down the side. -->
