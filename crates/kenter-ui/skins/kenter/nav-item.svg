<svg xmlns="http://www.w3.org/2000/svg" xmlns:pelt="urn:pelt:1.0"
     xmlns:inkscape="http://www.inkscape.org/namespaces/inkscape"
     xmlns:sodipodi="http://sodipodi.sourceforge.net/DTD/sodipodi-0.dtd"
     viewBox="0 0 180 44" pelt:scale="9-slice" pelt:content-inset="10 14 10 14">
  <!-- Inkscape only: the colour this element sits on in the app, so faint
       strokes and fills look in the editor as they do on screen. The app
       ignores it. -->
  <sodipodi:namedview pagecolor="#0f111a" inkscape:pageopacity="1" inkscape:pagecheckerboard="false" inkscape:deskcolor="#0f111a" bordercolor="#666666"/>
  <pelt:slices top="10" right="10" bottom="10" left="10"/>
  <g data-pelt-state="default" inkscape:groupmode="layer" inkscape:label="default">
    <g class="pelt-bg"><rect width="180" height="44" rx="8" fill="#ffffff" fill-opacity="0"/></g>
  </g>
  <g data-pelt-state="hover" inkscape:groupmode="layer" inkscape:label="hover" style="display:none">
    <g class="pelt-bg"><rect width="180" height="44" rx="8" fill="#ffffff" fill-opacity="0.05"/></g>
  </g>
  <g data-pelt-state="active" inkscape:groupmode="layer" inkscape:label="active" style="display:none">
    <g class="pelt-bg"><rect width="180" height="44" rx="8" fill="#39d0a7" fill-opacity="0.14"/></g>
    <g class="pelt-border"><rect x="0" y="10" width="3" height="24" rx="1.5" fill="#39d0a7"/></g>
  </g>
  <g inkscape:groupmode="layer" inkscape:label="text">
    <text data-pelt-label="label" x="18" y="26.760" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="600" fill="#c3c8d6">Billfold</text>
  </g>
</svg>
