<svg xmlns="http://www.w3.org/2000/svg" xmlns:pelt="urn:pelt:1.0"
     xmlns:inkscape="http://www.inkscape.org/namespaces/inkscape"
     xmlns:sodipodi="http://sodipodi.sourceforge.net/DTD/sodipodi-0.dtd"
     viewBox="0 0 160 44" pelt:scale="9-slice" pelt:content-inset="12 16 12 16">
  <!-- Inkscape only: the colour this element sits on in the app, so faint
       strokes and fills look in the editor as they do on screen. The app
       ignores it. -->
  <sodipodi:namedview pagecolor="#0e0f14" inkscape:pageopacity="1" inkscape:pagecheckerboard="false" inkscape:deskcolor="#0e0f14" bordercolor="#666666"/>
  <pelt:slices top="10" right="12" bottom="10" left="12"/>
  <g data-pelt-state="default" inkscape:groupmode="layer" inkscape:label="default">
    <g class="pelt-bg"><rect width="160" height="44" rx="10" fill="#39d0a7"/></g>
  </g>
  <g data-pelt-state="hover" inkscape:groupmode="layer" inkscape:label="hover" style="display:none">
    <g class="pelt-bg"><rect width="160" height="44" rx="10" fill="#4fe3ba"/></g>
  </g>
  <g inkscape:groupmode="layer" inkscape:label="text">
    <text data-pelt-label="label" x="80" y="27.100" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700" fill="#06231c" text-anchor="middle">Save</text>
  </g>
</svg>
