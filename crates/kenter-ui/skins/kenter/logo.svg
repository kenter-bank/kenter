  <!--
    PLACEHOLDER logo: a Kenter link, the detachable joining shackle that
    connects two lengths of a ship's stud-link anchor chain, and where the
    name comes from.

    What makes it a Kenter link rather than an ordinary chain link: it is
    built from two C-shaped halves that interlock, with a stud across the
    middle, and the seam between the halves stays visible. The tapered pin
    that runs diagonally through the parts is left out at icon size.

    Drawn as a skin so an artist can replace it in Inkscape without touching
    code. Keep the square viewBox: the host draws this into a
    square slot and stretches to fit.
  -->
  <g
     data-pelt-state="default"
     inkscape:groupmode="layer"
     inkscape:label="default"
     id="g4">
    <g
       transform="matrix(0.65929999,-0.46164682,0.46164682,0.65929999,-4.2125437,26.383452)"
       id="g3"
       style="stroke-width:16.2;stroke-dasharray:none">
