# Build the docs site (docs/, VitePress) and publish it to GitHub Pages
# at https://kenter.app. Files in docs/public/ are copied as they are,
# including .well-known/stellar.toml.
#
# Every action is pinned to a commit, not a tag, so a moved tag upstream
# cannot change what runs here. The tag each commit was taken from is in
# the comment beside it.
name: pages

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: "20"
      - name: Install (from the lockfile only)
        working-directory: docs
        run: npm ci --ignore-scripts
      - name: Build
        working-directory: docs
        run: npm run build
      - name: Check stellar.toml made it into the site
        run: test -s docs/.vitepress/dist/.well-known/stellar.toml
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: docs/.vitepress/dist

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
